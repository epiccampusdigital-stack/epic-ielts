<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS Timed Drills 2</title>
<style>
:root{--bg:#f6f8fc;--card:#fff;--ink:#0f1114;--muted:#5b6780;--line:#dae1ed;--accent:#0056d2;--navy:#002761;--ok:#276a1a;--okbg:#e9f5e6;--bad:#c0262d;--badbg:#fdecee;--warn:#a35b00;--warnbg:#fff4e0;--field:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151c;--card:#1a2029;--ink:#e8ecf2;--muted:#9aa6ba;--line:#2c3441;--accent:#6aa7ff;--navy:#c9d6ec;--ok:#7ed37a;--okbg:#1d2e1f;--bad:#ff8a8f;--badbg:#3a1d20;--warn:#ffc46b;--warnbg:#3a2c12;--field:#11151c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151c;--card:#1a2029;--ink:#e8ecf2;--muted:#9aa6ba;--line:#2c3441;--accent:#6aa7ff;--navy:#c9d6ec;--ok:#7ed37a;--okbg:#1d2e1f;--bad:#ff8a8f;--badbg:#3a1d20;--warn:#ffc46b;--warnbg:#3a2c12;--field:#11151c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Source Sans 3','Source Sans Pro',system-ui,Arial,sans-serif;padding:16px 16px 60px}
.wrap{max-width:900px;margin:0 auto;display:grid;gap:16px}
header h1{margin:0;font-size:28px}header p{margin:4px 0 0;color:var(--muted)}
nav{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
nav button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:50px;padding:7px 14px;font:inherit;font-weight:700;cursor:pointer}
nav button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
nav .sc{font-size:13px;color:var(--muted);font-weight:600;margin-left:4px}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:none;gap:14px}
section.on{display:grid}
h2{margin:0;font-size:22px;color:var(--navy)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:10px 12px}
.timer{font:800 26px/1 ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;min-width:86px}
.timer.low{color:var(--bad)}
.btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.tip{background:var(--warnbg);color:var(--ink);border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;font-size:15px}
.text{font:17px/1.75 Georgia,'Times New Roman',serif;background:var(--bg);border-radius:12px;padding:14px 16px;white-space:pre-line}
.q{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}.qn{font-weight:800;color:var(--accent)}
input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
input[type=text]{width:260px}textarea{width:100%;min-height:150px;resize:vertical}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.opts label{border:1.5px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer;font-weight:600}
.opts input{margin-right:6px}
.right{background:var(--okbg)!important;border-color:var(--ok)!important}
.wrong{background:var(--badbg)!important;border-color:var(--bad)!important}
.fb{font-size:14px;margin-top:4px;color:var(--muted)}.fb b{color:var(--ok)}
.score{font-weight:800;font-size:18px}
.play{border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:5px 12px;font:inherit;font-weight:700;cursor:pointer;margin-right:8px}
.wc{font-size:14px;color:var(--muted)}
.model{display:none;background:var(--okbg);border-radius:12px;padding:12px 14px;white-space:pre-line}
.model.show{display:block}
table.g{border-collapse:collapse;font-size:15px}table.g td,table.g th{border:1px solid var(--line);padding:5px 10px;text-align:center}
.hlist{margin:0;padding-left:22px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<header><h1>IELTS Timed Drills 2</h1><p>Six quick drills on the small things that cost the most marks: spelling, numbers, word limits, paraphrasing, grammar and linking words. Press <b>Start</b>: answers are marked when time is up (or press Check). Headphones for Drills 1 and 2.</p></header>
<nav id="nav"></nav>
<div id="secs"></div>
</div>
<script>
const SECS = [
 { id:'s1', name:'Spelling', title:'Drill 1 · Spelling under pressure', min:8, type:'listen',
   tip:'In IELTS, a word spelled wrong is a wrong answer. Listen and type each word. Each one can be played twice.',
   items:[
    ['Word 1','accommodation. Students need cheap accommodation near the university. accommodation.',['accommodation']],
    ['Word 2','environment. We must protect the environment. environment.',['environment']],
    ['Word 3','government. The government built a new hospital. government.',['government']],
    ['Word 4','necessary. A visa is necessary for this trip. necessary.',['necessary']],
    ['Word 5','Wednesday. The class is on Wednesday. Wednesday.',['wednesday']],
    ['Word 6','February. The course starts in February. February.',['february']],
    ['Word 7','library. Return the books to the library. library.',['library']],
    ['Word 8','restaurant. We met at a Korean restaurant. restaurant.',['restaurant']],
    ['Word 9','temperature. The temperature dropped at night. temperature.',['temperature']],
    ['Word 10','recommend. I recommend this book. recommend.',['recommend']],
    ['Word 11','beginning. At the beginning of the course. beginning.',['beginning']],
    ['Word 12','opportunity. It is a great opportunity. opportunity.',['opportunity']] ],
   fb:'Check double letters (accommodation, recommend, beginning, opportunity) and silent letters (Wednesday, February, government, environment).' },
 { id:'s2', name:'Numbers', title:'Drill 2 · Numbers, dates and codes', min:8, type:'listen',
   tip:'Fifteen or fifty? Thirteen or thirty? Listen to the stress: fif-TEEN (end) and FIF-ty (start). Write numbers as digits.',
   items:[
    ['Room number','The room number is fifteen.',['15']],
    ['Price: £','It costs fifty pounds.',['50']],
    ['Start date','The course starts on the twenty-first of March.',['21march','21stmarch','march21','march21st','21/3','21.3']],
    ['Bus time','The bus leaves at twenty to eight in the morning.',['7:40','740','7.40','0740','07:40','7:40am','7.40am']],
    ['Phone','The number is zero seven seven, double four, three nine, two one.',['077443921','0774439 21']],
    ['Population','The population is about one point five million.',['1.5million','1500000','1,500,000','15million']],
    ['Increase: ___ %','Prices went up by thirteen percent.',['13','13%']],
    ['Cost: $','The ticket is two hundred and eighty dollars.',['280']],
    ['Meeting date','The meeting is on the third of December.',['3december','3rddecember','december3','december3rd','3/12','3.12']],
    ['Flight','The flight number is B A two seven zero.',['ba270']] ],
   fb:'Dates: write "21 March" or "March 21". "Double four" = 44. Codes: write letters and numbers exactly.' },
 { id:'s3', name:'Word limit', title:'Drill 3 · The word limit trap', min:5, type:'mc', opts:['OK','Too many words'],
   tip:'The instruction says: NO MORE THAN TWO WORDS AND/OR A NUMBER. Is each answer allowed? A correct idea with too many words gets ZERO.',
   items:[
    ['a red bicycle',1,'3 words. Write "red bicycle" or "bicycle".'],
    ['bicycle',0,'1 word.'],
    ['15 June',0,'A number + one word.'],
    ['the city library',1,'3 words. "city library" is fine.'],
    ['two weeks',0,'2 words.'],
    ['every second Monday',1,'3 words.'],
    ['7.30 pm',0,'A number + one word.'],
    ['a very large garden',1,'4 words. "large garden" is fine.'] ] },
 { id:'s4', name:'Paraphrase', title:'Drill 4 · Paraphrase matching', min:6, type:'select',
   tip:'IELTS questions almost never use the same words as the text. Match each question phrase to the phrase with the SAME meaning in the text.',
   list:['is free of charge','increase','senior citizens','prohibited','annually','the favourite of most visitors','commence','just over 50 percent','reduced','in the past'],
   items:[['costs nothing',0],['go up',1],['elderly people',2],['not allowed',3],['every year',4],['the most popular',5],['start',6],['a bit more than half',7]],
   fb:'Learn these in pairs. When you scan a text, look for the meaning, not the same word.' },
 { id:'s5', name:'Grammar', title:'Drill 5 · Spot the correct sentence', min:8, type:'mcl',
   tip:'These are the most common mistakes in IELTS writing. Choose the ONE correct sentence.',
   items:[
    [['The number of student increased.','The number of students increased.','The number of students were increased.'],1,'"The number of" + plural noun + singular verb.'],
    [['In 2010, sales rose to 50.','In 2010, sales rise to 50.','In 2010, sales raised to 50.'],0,'Past years = past tense. "rise/rose" has no object; "raise" needs one.'],
    [['Many people thinks that technology is helpful.','Many people is thinking that technology is helpful.','Many people think that technology is helpful.'],2,'"people" is plural: people think.'],
    [['There is many advantages.','There are many advantages.','There have many advantages.'],1,'Plural noun: there are.'],
    [['It was decreased from 20 to 10.','It decreased to 20 from 10.','It decreased from 20 to 10.'],2,'"decrease" has no passive here; from the old number to the new one.'],
    [['Studying abroad is more expensive than studying at home.','Studying abroad is more expensive than study at home.','Studying abroad is more expensive that studying at home.'],0,'Compare the same forms: studying ... studying. And "than", not "that".'],
    [['The percentage of women was higher than men.','The percentage of women was higher than that of men.','The percentage of women was more high than men.'],1,'Compare percentage with percentage: "than that of men".'],
    [['In conclusion, I am agree that phones help students.','In conclusion, I agreeing that phones help students.','In conclusion, I agree that phones help students.'],2,'"agree" is a verb: I agree (never "I am agree").'] ] },
 { id:'s6', name:'Linking', title:'Drill 6 · Linking words for Task 2', min:6, type:'gap',
   tip:'Linking words show the examiner how your ideas connect. Choose the best one for each gap.',
   words:['However','Therefore','For example','In addition','Although','As a result','In conclusion','On the other hand'],
   items:[
    ['Studying abroad is expensive. ________, many families save for years to pay for it.',0,'Contrast between two sentences: However.'],
    ['Phones can distract students. ________, some schools ban them.',1,'A result of the first idea: Therefore.'],
    ['Many jobs need English. ________, hotels and airlines want staff who speak it well.',2,'An example follows: For example.'],
    ['Exercise is good for the body. ________, it improves our mood.',3,'Adding another point: In addition.'],
    ['________ the course was difficult, most students passed.',4,'Joins two parts of one sentence with contrast: Although.'],
    ['Many people moved to the city. ________, house prices rose.',5,'A result: As a result.'],
    ['________, I believe both sides have good points, but young people should study abroad if they can.',6,'Starts the last paragraph: In conclusion.'],
    ['Some say cities are exciting. ________, others say they are stressful.',7,'Giving the other side: On the other hand.'] ] },
];
const $ = (s, el = document) => el.querySelector(s);
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9:./%]/g, '');
const store = { get(k) { try { return JSON.parse(localStorage.getItem('drills2-' + k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem('drills2-' + k, JSON.stringify(v)); } catch { /* blocked */ } } };
let voice = null;
function pickVoice() { const v = speechSynthesis.getVoices(); voice = v.find(x => x.lang === 'en-GB' && /google|natural/i.test(x.name)) || v.find(x => x.lang === 'en-GB') || v.find(x => /^en/.test(x.lang)) || null; }
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
const L = 'ABCDEFGHIJ';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
let html = '';
for (const S of SECS) {
  let qs = '';
  S.items.forEach((it, i) => {
    let body = '';
    if (S.type === 'listen') body = `<button class="play" data-s="${S.id}" data-i="${i}">▶ Play (2 left)</button>${esc(it[0])}: <input type="text" data-i="${i}" aria-label="${esc(it[0])}">`;
    if (S.type === 'mc') body = `<b>${esc(it[0])}</b><div class="opts">${S.opts.map((o, k) => `<label><input type="radio" name="${S.id}${i}" value="${k}">${o}</label>`).join('')}</div>`;
    if (S.type === 'mcl') body = `<div class="opts" style="display:grid;gap:6px">${it[0].map((o, k) => `<label><input type="radio" name="${S.id}${i}" value="${k}">${L[k]}. ${esc(o)}</label>`).join('')}</div>`;
    if (S.type === 'select') body = `<b>${esc(it[0])}</b> = <select data-i="${i}"><option value="">Choose…</option>${S.list.map((o, k) => `<option value="${k}">${L[k]}. ${esc(o)}</option>`).join('')}</select>`;
    if (S.type === 'gap') body = esc(it[0]).replace('________', `<select data-i="${i}"><option value="">________</option>${S.words.map((o, k) => `<option value="${k}">${o}</option>`).join('')}</select>`);
    qs += `<div class="q"><div class="qn">${i + 1}</div><div>${body}<div class="fb"></div></div></div>`;
  });
  html += `<section id="${S.id}" data-min="${S.min}"><h2>${S.title}</h2><div class="tip">${S.tip}</div>${S.type === 'listen' && !('speechSynthesis' in window) ? '<div class="tip" style="border-color:var(--bad)"><b>Sound is not available in this browser.</b> Please use Google Chrome or Microsoft Edge.</div>' : ''}<div class="bar"><span class="timer">--:--</span><button class="btn start">Start</button><button class="btn sec check">Check</button><span class="score"></span></div>${S.type === 'select' ? `<div class="tip" style="border-color:var(--accent)"><b>Phrases in the text:</b> ${S.list.map((o, k) => `${L[k]}. ${esc(o)}`).join(' · ')}</div>` : ''}<div class="qs">${qs}</div>${S.fb ? `<div class="fb fbend" style="display:none"><b>Tip:</b> ${S.fb}</div>` : ''}</section>`;
}
$('#secs').innerHTML = html;
const nav = $('#nav');
SECS.forEach((S, i) => { const b = document.createElement('button'); b.dataset.id = S.id; b.innerHTML = `${i + 1}. ${S.name} <span class="sc"></span>`; b.onclick = () => show(S.id); nav.appendChild(b); });
function show(id) { document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === id)); nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === id)); store.set('tab', id); }
const plays = {};
document.addEventListener('click', e => {
  const b = e.target.closest('.play'); if (!b) return;
  const S = SECS.find(x => x.id === b.dataset.s), k = b.dataset.s + b.dataset.i; plays[k] = (plays[k] || 0) + 1;
  const u = new SpeechSynthesisUtterance(S.items[b.dataset.i][1]); u.lang = 'en-GB'; u.rate = 0.9; if (voice) u.voice = voice;
  speechSynthesis.cancel(); setTimeout(() => speechSynthesis.speak(u), 120);
  const left = 2 - plays[k]; b.textContent = left > 0 ? `▶ Play (${left} left)` : 'Played twice'; if (left <= 0) b.disabled = true;
});
function mark(S) {
  const sec = $('#' + S.id); let g = 0;
  S.items.forEach((it, i) => {
    const q = sec.querySelectorAll('.q')[i], fbx = q.querySelector('.fb'); let ok = false, right = '', why = '';
    if (S.type === 'listen') { const inp = q.querySelector('input'); ok = it[2].some(a => norm(a) === norm(inp.value)); inp.classList.add(ok ? 'right' : 'wrong'); right = it[2][0].toUpperCase(); why = `Audio: "${it[1]}"`; }
    if (S.type === 'mc' || S.type === 'mcl') { const c = q.querySelector('input:checked'); ok = !!c && +c.value === it[1]; q.querySelectorAll('label').forEach((l, k) => { if (k === it[1]) l.classList.add('right'); else if (l.querySelector('input').checked) l.classList.add('wrong'); }); right = S.type === 'mc' ? S.opts[it[1]] : `${L[it[1]]}`; why = it[2]; }
    if (S.type === 'select') { const s = q.querySelector('select'); ok = s.value === String(it[1]); s.classList.add(ok ? 'right' : 'wrong'); right = `${L[it[1]]}. ${S.list[it[1]]}`; }
    if (S.type === 'gap') { const s = q.querySelector('select'); ok = s.value === String(it[1]); s.classList.add(ok ? 'right' : 'wrong'); right = S.words[it[1]]; why = it[2]; }
    if (ok) g++;
    fbx.innerHTML = `<b>${esc(right)}</b>${why ? ' · ' + esc(why) : ''}`;
  });
  const end = sec.querySelector('.fbend'); if (end) end.style.display = 'block';
  $(`#${S.id} .score`).textContent = `${g} / ${S.items.length}`; nav.querySelector(`[data-id=${S.id}] .sc`).textContent = `${g}/${S.items.length}`;
}
SECS.forEach(S => {
  const sec = $('#' + S.id), t = $('.timer', sec), start = $('.start', sec), check = $('.check', sec);
  let left = S.min * 60, iv = null, done = false;
  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  t.textContent = fmt(left);
  const finish = () => { if (done) return; done = true; clearInterval(iv); start.disabled = true; check.disabled = true; t.textContent = "Time's up"; mark(S); sec.querySelectorAll('input,select').forEach(x => { x.disabled = true; }); };
  start.onclick = () => { if (iv || done) return; start.textContent = 'Running…'; start.disabled = true; iv = setInterval(() => { left--; t.textContent = fmt(left); t.classList.toggle('low', left <= 60); if (left <= 0) finish(); }, 1000); };
  check.onclick = finish;
});
show(store.get('tab') || 's1');
</script>
</body>
</html>
